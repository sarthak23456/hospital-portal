<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hospital Diet Portal</title>
  <link rel="stylesheet" href="hospital.css">
</head>
<body>

  <header>
    <img src="top.jfif" alt="Hospital Header">
  </header>

  <nav>
    <button onclick="showSection('nurseSection')">Nurse/Doctor</button>
    <button disabled>Dietitian</button>
    <button disabled>Manager/FnB Manager</button>
    <button disabled>Kitchen/Storage Manager</button>
    <button onclick="showSection('orderSection')">Order Taker/Receiver</button>
  </nav>

  <main class="content">

    <!-- Nurse Section (from before) -->
    <section id="nurseSection" class="box">
      <h2>Nurse/Doctor Details</h2>
      <label>ID Number:</label>
      <input type="text">

      <label>Patient Name:</label>
      <input type="text">

      <label>Bed Number:</label>
      <input type="text">

      <label>Date:</label>
      <input type="date">

      <button class="submit-btn" onclick="goToAddPatient()">Submit</button>
    </section>

    <section id="addPatientSection" class="box hidden">
      <h2>Proceed</h2>
      <button class="submit-btn" onclick="showPatientForm()">Add New Patient Info</button>
    </section>

    <section id="patientFormSection" class="box hidden">
      <h2>Patient Diet Form</h2>
      <label>Bed Number:</label>
      <input type="text">

      <label>Patient Name:</label>
      <input type="text">

      <label>Diet Preference:</label>
      <select>
        <option>Solid</option>
        <option>Liquid</option>
        <option>Semi-Liquid</option>
      </select>

      <label>Special Diet:</label>
      <input type="text">

      <label>Patient Disease:</label>
      <input type="text">

      <button class="submit-btn" onclick="askAllergy()">Submit</button>
    </section>

    <section id="allergySection" class="box hidden">
      <h2>Does the Patient Have Any Allergies?</h2>
      <button class="submit-btn" onclick="finalSubmit('Yes')">Yes</button>
      <button class="submit-btn" onclick="finalSubmit('No')">No</button>
    </section>

    <!-- Order Taker Section -->
    <section id="orderSection" class="box hidden">
      <h2>Select Patient Type</h2>
      <button class="submit-btn" onclick="showSection('diabeticSection')">Diabetic</button>
      <button disabled>Cardiac</button>
      <button disabled>Renal</button>
    </section>

    <!-- Diabetic Section -->
    <section id="diabeticSection" class="box hidden">
      <h2>Diabetic Patient Diet</h2>

      <!-- Solid -->
      <div class="diet-box solid">
        <h3>Solid Diet - 107 Patients</h3>
        <button class="small-btn" onclick="markReceived(this)">Received</button>
        <label><input type="checkbox" class="diet-check" onchange="checkAllReceived()"> Done</label>
      </div>

      <!-- Semi-Solid -->
      <div class="diet-box semi">
        <h3>Semi-Solid Diet - 83 Patients</h3>
        <button class="small-btn" onclick="markReceived(this)">Received</button>
        <label><input type="checkbox" class="diet-check" onchange="checkAllReceived()"> Done</label>
      </div>

      <!-- Liquid -->
      <div class="diet-box liquid">
        <h3>Liquid Diet - 56 Patients</h3>
        <button class="small-btn" onclick="markReceived(this)">Received</button>
        <label><input type="checkbox" class="diet-check" onchange="checkAllReceived()"> Done</label>
      </div>

      <!-- Special Diet -->
      <div class="diet-box special">
        <h3>Special Diet - 12 Patients</h3>
        <button class="small-btn" onclick="markReceived(this)">Received</button>
        <label><input type="checkbox" class="diet-check" onchange="checkAllReceived()"> Done</label>
        <div style="margin-top: 10px;">
          <label>Manually Input the Diet Chart:</label>
          <input type="text" placeholder="Enter special diet chart...">
        </div>
      </div>

      <button id="forwardBtn" class="submit-btn" style="margin-top: 20px;" disabled>Forward it to the Nurse</button>
    </section>

  </main>

  <script>
    function showSection(id) {
      document.querySelectorAll('.box').forEach(el => el.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    function goToAddPatient() {
      showSection('addPatientSection');
    }

    function showPatientForm() {
      showSection('patientFormSection');
    }

    function askAllergy() {
      showSection('allergySection');
    }

    function finalSubmit(answer) {
      alert("Allergy: " + answer + " — Patient Info Submitted.");
      showSection('nurseSection');
    }

    function markReceived(btn) {
      btn.innerText = "Received ✔";
      btn.disabled = true;
    }

    function checkAllReceived() {
      const checkboxes = document.querySelectorAll('.diet-check');
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      document.getElementById('forwardBtn').disabled = !allChecked;
    }
  </script>

</body>
</html>
